<!DOCTYPE html>
<html>
<head>
<title>file merger</title>
<style>
body {
    background: #0d0d0d;
    color: #eaeaea;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.box {
    background: #161616;
    padding: 20px;
    border-radius: 12px;
    width: 320px;
    text-align: center;
}
input, button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 8px;
}
button {
    cursor: pointer;
}
button:hover {
    background: #333;
}
</style>
</head>
<body>

<div class="box">
    <h2>file merger</h2>
    <input type="file" id="files" multiple>
    <input type="text" id="name" placeholder="output filename">
    <button id="mergeBtn">merge files</button>
</div>

<script>
const btn = document.getElementById("mergeBtn");

btn.addEventListener("click", () => {
    const files = document.getElementById("files").files;
    const name = document.getElementById("name").value || "merged.bin";

    if (files.length < 2) return;

    let blobs = [];
    for (let i = 0; i < files.length; i++) {
        blobs.push(files[i]);
    }

    const merged = new Blob(blobs);
    const url = URL.createObjectURL(merged);

    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
